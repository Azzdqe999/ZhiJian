<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>正在朗读</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #1b1a18; color: #f3ede2; font-family: "Noto Serif SC", "Songti SC", SimSun, serif; }
  .card { height: 100%; padding: 12px 14px 10px; display: flex; flex-direction: column; gap: 6px; -webkit-app-region: drag; }
  .head { display: flex; align-items: center; justify-content: space-between; font-family: sans-serif; font-size: 11px; color: #b9ad9a; }
  .close { -webkit-app-region: no-drag; width: 26px; height: 26px; border: 0; border-radius: 50%; background: transparent; color: #b9ad9a; font-size: 18px; cursor: pointer; }
  .close:hover { background: #2c2925; color: #fff; }
  p { margin: 0; font-size: 13px; line-height: 1.7; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .prev, .next { color: #8f8578; }
  .current { color: #f3ede2; background: rgba(164,85,47,0.22); border-left: 3px solid #a4552f; padding: 4px 8px; border-radius: 4px; -webkit-line-clamp: 3; }
  .actions { margin-top: auto; display: flex; align-items: center; justify-content: space-between; -webkit-app-region: no-drag; }
  .controls { display: flex; align-items: center; gap: 6px; }
  button.ctl { padding: 4px 8px; border: 1px solid #4a443b; border-radius: 12px; background: transparent; color: #cfc4b4; font-size: 11px; cursor: pointer; }
  button.ctl:hover { border-color: #a4552f; color: #e8b08f; }
  button.pause { width: 34px; height: 30px; border: 1px solid #a4552f; border-radius: 50%; background: rgba(164,85,47,0.18); color: #f3ede2; font-size: 13px; line-height: 1; cursor: pointer; }
  button.pause:hover { background: rgba(164,85,47,0.35); }
  .hint { font-family: sans-serif; font-size: 10px; color: #6f665a; }
</style>
</head>
<body>
  <div class="card">
    <div class="head"><span id="title">正在朗读</span><button class="close" id="close" title="关闭">×</button></div>
    <p class="prev" id="prev"></p>
    <p class="current" id="current">等待朗读…</p>
    <p class="next" id="next"></p>
    <div class="actions">
      <div class="controls">
        <button class="ctl" id="back" title="回退 5 秒">−5s</button>
        <button class="pause" id="pause" title="暂停">⏸</button>
        <button class="ctl" id="forward" title="前进 5 秒">+5s</button>
      </div>
      <span class="hint">拖动窗口移动 · 始终置顶</span>
    </div>
  </div>
  <script>
    const nodes = {
      title: document.getElementById('title'),
      prev: document.getElementById('prev'),
      current: document.getElementById('current'),
      next: document.getElementById('next'),
      pause: document.getElementById('pause'),
    }
    window.paperOverlay.onUpdate((data) => {
      nodes.title.textContent = data.title ? '正在朗读 · ' + data.title : '正在朗读'
      nodes.prev.textContent = data.prev || ''
      nodes.current.textContent = data.current || ''
      nodes.next.textContent = data.next || ''
      nodes.pause.textContent = data.paused ? '▶' : '⏸'
      nodes.pause.title = data.paused ? '继续' : '暂停'
    })
    nodes.pause.addEventListener('click', () => window.paperOverlay.action('toggle'))
    document.getElementById('back').addEventListener('click', () => window.paperOverlay.action('back5'))
    document.getElementById('forward').addEventListener('click', () => window.paperOverlay.action('forward5'))
    document.getElementById('close').addEventListener('click', () => window.paperOverlay.close())
  </script>
</body>
</html>
